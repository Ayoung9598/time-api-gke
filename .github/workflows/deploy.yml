name: Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: time-api-cluster
  GKE_ZONE: us-central1-a
  DEPLOYMENT_NAME: time-api
  IMAGE_NAME: time-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA ./time-api-gke
          docker tag gcr.io/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA gcr.io/$PROJECT_ID/$IMAGE_NAME:latest

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./time-api-gke

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=$PROJECT_ID" \
            -var="network_name=${{ secrets.NETWORK_NAME }}" \
            -var="credentials_file=" \
            -out=tfplan
        working-directory: ./time-api-gke

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./time-api-gke

      - name: Update Kubernetes deployment
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $PROJECT_ID
          kubectl set image deployment/$DEPLOYMENT_NAME $IMAGE_NAME=gcr.io/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA -n time-api
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n time-api

      - name: Test API
        run: |
          EXTERNAL_IP=$(kubectl get service $DEPLOYMENT_NAME -n time-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "API URL: http://$EXTERNAL_IP/time"
          sleep 30  # Wait for load balancer to be ready
          curl -f http://$EXTERNAL_IP/time || exit 1
